name: CI

# Тесты и линтер на каждый push в любую ветку и на каждый PR.
# Этот же workflow вызывается из deploy.yml (workflow_call): образ не
# собирается и не выкатывается, пока тесты не прошли.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev --locked

      - name: Run ruff check
        run: uv run ruff check src/

      - name: Run ruff format check
        run: uv run ruff format --check src/

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev --locked

      # Интеграционные тесты поднимают встроенный PostgreSQL 16 (pgserver)
      # и fakeredis — внешние сервисы и секреты не нужны. Реальный Telegram,
      # ЮKassa и Sentry в тестах не используются.
      - name: Run pytest
        run: uv run pytest src/tests -q -p no:cacheprovider --cov --cov-report=term:skip-covered

  typecheck:
    runs-on: ubuntu-latest
    # mypy сейчас не блокирует merge: в репозитории накоплен большой долг
    # предупреждений (не связанных с текущими правками), накопленный за
    # время, когда mypy не входил в CI вовсе. Джоба здесь, чтобы новые ошибки
    # были видны в PR, а не чтобы блокировать прохождение CI до полной чистки.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev --locked

      - name: Run mypy
        run: uv run mypy src/

name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  # Сначала тесты и линтер — тот же CI, что на каждый коммит.
  # Если они упали, образ не собирается и в прод ничего не уходит.
  ci:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/koresh06/auto_nomera:latest
            ghcr.io/koresh06/auto_nomera:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max